name: Build Android APK (ATLANTIS AI)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Signed APK Directly via Node APK Compiler
        run: node build-apk.js

      - name: Upload ATLANTIS-AI.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLANTIS-AI-apk
          path: ATLANTIS-AI.apk
